<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      .text { fill: #f0f6fc; }
      .grid { stroke: rgba(255,255,255,0.05); }
    }
    @media (prefers-color-scheme: light) {
      .text { fill: #1f2328; }
      .grid { stroke: rgba(0,0,0,0.05); }
    }
    .node-anim { animation: float 3s ease-in-out infinite; }
    .line-anim { stroke-dasharray: 10,10; animation: dash 1s linear infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }
  </style>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" class="grid" fill="currentColor" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <path d="M100,100 C250,100 350,150 500,100 S700,50 700,100" 
        stroke="#ff0072" stroke-width="3" fill="none" class="line-anim" />

  <g class="node-anim" style="animation-delay: 0s;">
    <rect x="70" y="80" width="60" height="40" rx="8" fill="#ff0072" />
    <text x="100" y="105" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">Start</text>
  </g>

  <g class="node-anim" style="animation-delay: 0.5s;">
    <rect x="370" y="80" width="60" height="40" rx="8" fill="#ff3e00" />
    <text x="400" y="105" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">Process</text>
  </g>

  <g class="node-anim" style="animation-delay: 1s;">
    <rect x="670" y="80" width="60" height="40" rx="8" fill="#ff0072" />
    <text x="700" y="105" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">End</text>
  </g>
</svg>
